<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- White halo so the black link still reads on dark toolbars. -->
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grown"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grown" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gaps where one link passes over the other, as in the classic symbol. -->
    <mask id="under-top" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#top)"><rect x="57" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="29"/></g>
    </mask>
    <mask id="under-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#bottom)"><rect x="13" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="29"/></g>
    </mask>
    <clipPath id="top"><circle cx="64" cy="48.8" r="13"/></clipPath>
    <clipPath id="bottom"><circle cx="64" cy="79.2" r="13"/></clipPath>
  </defs>
  <g filter="url(#halo)">
    <g transform="rotate(-45 64 64)">
      <!-- The mascot's body: a white link. -->
      <rect x="13" y="44" width="58" height="40" rx="20" fill="#fff"/>
      <!-- The next link in the chain. -->
      <rect x="57" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="17" mask="url(#under-bottom)"/>
      <rect x="13" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="17" mask="url(#under-top)"/>
    </g>
  </g>
</svg>
