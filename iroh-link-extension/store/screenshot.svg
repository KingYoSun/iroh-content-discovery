<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 12.5px; fill: #111; }
    .muted { fill: #555; }
  </style>
  <rect width="1280" height="800" fill="#f4f4f2"/>
  <svg x="80" y="64" width="104" height="104" viewBox="0 0 128 128">
  <defs>
    <!-- White halo so the black link still reads on dark toolbars. -->
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grown" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gaps where one link passes over the other, as in the classic symbol. -->
    <mask id="under-top" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#top)"><rect x="57" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="22"/></g>
    </mask>
    <mask id="under-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#bottom)"><rect x="13" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="22"/></g>
    </mask>
    <clipPath id="top"><circle cx="64" cy="48.8" r="13"/></clipPath>
    <clipPath id="bottom"><circle cx="64" cy="79.2" r="13"/></clipPath>
  </defs>
  <g filter="url(#halo)">
    <!-- Waving arm, rubber hose. -->
    <path d="M30 66 C20 62 17 54 20 45" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <g stroke-linecap="round" fill="none">
      <g stroke="#000" stroke-width="8.5">
        <path d="M20 43 L14 34"/><path d="M20 43 L19 31"/><path d="M20 43 L24 32"/><path d="M20 43 L28 38"/>
      </g>
      <g stroke="#fff" stroke-width="4">
        <path d="M20 43 L14 34"/><path d="M20 43 L19 31"/><path d="M20 43 L24 32"/><path d="M20 43 L28 38"/>
        <circle cx="20" cy="43" r="2.5" fill="#fff"/>
      </g>
    </g>
    <g transform="rotate(-45 64 64)">
      <!-- The mascot's body: a white link. -->
      <rect x="13" y="44" width="58" height="40" rx="20" fill="#fff"/>
      <!-- The next link in the chain. -->
      <rect x="57" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="12" mask="url(#under-bottom)"/>
      <rect x="13" y="44" width="58" height="40" rx="20" fill="none" stroke="#000" stroke-width="12" mask="url(#under-top)"/>
    </g>
    <!-- Face, upright, glancing sideways at the other link: "ask him". -->
    <ellipse cx="38" cy="80" rx="3.8" ry="5.8" fill="#000"/>
    <ellipse cx="49" cy="79" rx="3.8" ry="5.8" fill="#000"/>
    <ellipse cx="39.3" cy="78" rx="1.3" ry="1.8" fill="#fff"/>
    <ellipse cx="50.3" cy="77" rx="1.3" ry="1.8" fill="#fff"/>
    <path d="M37 90 Q43 92 51 87" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <ellipse cx="60" cy="120" rx="30" ry="3" fill="#000" opacity=".12"/>
</svg>
  <text x="200" y="132" class="sans" font-size="48" font-weight="700">iroh link</text>
  <text x="80" y="228" class="sans" font-size="24">Open content-addressed links through the iroh gateway</text>
  <text x="80" y="262" class="sans" font-size="24">running on your own machine.</text>

  <!-- Before: the link as clicked. -->
  <rect x="80" y="310" width="770" height="46" rx="23" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="104" y="338" class="mono">https://<tspan font-weight="700">wj3drgzdpnf54rxf5d8qd3dqne14j8umgczgrdp95w77zuxmxfu9</tspan>.blake3.net/docs/</text>

  <!-- Arrow. -->
  <path d="M112 370 V414 M102 404 L112 418 L122 404" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="400" class="sans muted" font-size="17">redirected inside the browser; blake3.net is never contacted</text>

  <!-- After: where the browser actually goes. -->
  <rect x="80" y="432" width="770" height="46" rx="23" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="104" y="460" class="mono">http://<tspan font-weight="700">wj3drgzdpnf54rxf5d8qd3dqne14j8umgczgrdp95w77zuxmxfu9</tspan>.blake3.localhost:45475/docs/</text>
  <text x="84" y="508" class="sans muted" font-size="17">Your local gateway fetches the content peer-to-peer and verifies it by hash.</text>

  <g class="sans" font-size="19">
    <text x="80" y="590">—  Works for *.blake3.net content and *.pkarr.net names</text>
    <text x="80" y="626">—  Paths and query strings are kept</text>
    <text x="80" y="662">—  Collects no data</text>
  </g>

  <!-- The toolbar popup, as rendered from popup.html. -->
  <text x="884" y="250" class="sans muted" font-size="14">Toolbar popup</text>
  <rect x="884" y="272" width="316" height="300" rx="12" fill="#000" opacity=".06" transform="translate(0 6)"/>
  <rect x="880" y="264" width="320" height="300" rx="12" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="904" y="304" class="sans" font-size="21" font-weight="700">iroh link</text>
  <text x="904" y="336" class="sans" font-size="14">Open blake3.net and pkarr.net through your</text>
  <text x="904" y="357" class="sans" font-size="14">local gateway.</text>
  <text x="904" y="394" class="sans" font-size="14">Gateway port</text>
  <rect x="904" y="404" width="272" height="34" rx="4" fill="#fff" stroke="#888"/>
  <text x="914" y="426" class="sans" font-size="14">45475</text>
  <rect x="904" y="458" width="272" height="36" rx="5" fill="#eee" stroke="#888"/>
  <text x="1040" y="481" class="sans" font-size="14" text-anchor="middle">Save</text>
  <text x="904" y="530" class="sans" font-size="14">Saved: http://127.0.0.1:45475</text>
</svg>
